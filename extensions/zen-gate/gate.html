<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zen Gate</title>
  <link rel="stylesheet" href="gate.css">
</head>
<body>
  <main class="gate">
    <div class="stage"><p class="idea"><span class="zen-quote"></span><b class="zen-author"></b></p></div>
    <footer class="footer">
      <div class="meta"></div>
      <nav class="actions" aria-label="Pause controls"><button id="leave" type="button">Not now</button></nav>
      <div class="timer" id="progress-time" role="timer" aria-label="Time remaining"></div>
    </footer>
  </main>
  <script type="module" src="gate.js"></script>
</body>
</html>
