[package]
name = "livae-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "livae"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
livae-core.workspace = true
global-hotkey.workspace = true
block2 = "0.6"
dispatch2 = "0.3"
evalexpr = "13"
toml = "0.9"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSKeyValueCoding", "NSLocale", "NSRange", "NSProcessInfo", "NSGeometry", "NSThread", "NSNotification", "NSDate", "NSRunLoop", "NSTimer", "NSURL", "NSArray", "NSObject", "NSAttributedString", "NSDictionary", "NSData", "NSError", "NSValue", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWindow", "NSPanel", "NSView", "NSResponder", "NSColor", "NSTextField", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSEvent", "NSScreen", "NSVisualEffectView", "NSTextView", "NSText", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "NSButton", "NSButtonCell", "NSCell", "NSTextFieldCell", "NSAppearance", "NSAttributedString", "NSGlassEffectView", "NSBox", "NSImage", "NSImageView", "NSWorkspace", "NSWindowController", "NSPasteboard", "NSEvent", "NSTrackingArea", "NSSlider", "NSSwitch", "NSPopUpButton", "NSMenuItem", "NSOpenPanel", "NSSavePanel", "NSBitmapImageRep", "NSImageRep", "NSRunningApplication", "NSWindowController", "NSGraphics", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core", "NSAnimation", "NSAnimationContext", "NSAccessibility", "NSTextInputClient", "NSShadow", "NSDragging", "NSDraggingItem", "NSDraggingSession"] }
objc2-core-image = { version = "0.3", default-features = false, features = ["std", "CIFilter"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAGradientLayer", "CATransform3D", "CAMediaTimingFunction", "CATransaction", "CAAnimation", "CAMediaTiming", "CABase", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGColor", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["HIServices", "AXUIElement", "AXError", "AXValue", "std", "libc"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFString", "CFDictionary", "CFNumber", "CFArray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
